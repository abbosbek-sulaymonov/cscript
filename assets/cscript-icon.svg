<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CScript">
  <title>CScript</title>
  <!-- A large C with the word set in its opening, the way C++ puts its `++`
       there. The C is what survives being drawn at sixteen pixels beside a
       filename; the word is what makes it this language rather than that one,
       and is legible from about twenty-four pixels up. -->
  <defs>
    <linearGradient id="cscript-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6cb0"/>
      <stop offset="1" stop-color="#1a365d"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#cscript-ground)"/>

  <!-- Stroked rather than set as text, so it renders identically without
       depending on a font being installed. 272 degrees of a circle, leaving
       the mouth open to the right. -->
  <path d="M47.04 50.48A23 23 0 1 1 47.04 18.52"
        fill="none" stroke="#f7fafc" stroke-width="8.5" stroke-linecap="round"/>

  <!-- textLength pins the width whatever font the renderer finds, so the word
       cannot overflow the C or the tile on a machine without this one. -->
  <text x="33.5" y="39" textLength="26.5" lengthAdjust="spacingAndGlyphs"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#f7fafc">script</text>
</svg>
